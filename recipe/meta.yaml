{% set name = "geedim" %}
{% set version = "2.0.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/geedim-{{ version }}.tar.gz
  sha256: 58578f57d88082e9882c9f5ccf04060b46b50b2e2cebfb54032aac79bf9cc0d3

build:
  entry_points:
    - geedim=geedim.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.19
    - rasterio >=1.3.8
    - click >=8
    - tqdm >=4.6
    - earthengine-api >=0.1.379
    - tabulate >=0.9
    - fsspec >=2025.2
    - aiohttp >=3.11
test:
  imports:
    - geedim
  commands:
    - pip check
    - geedim --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/leftfield-geospatial/geedim
  summary: Export and cloud mask Google Earth Engine imagery.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dugalh
